<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オウチエイゴ 画面比較</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:16px; background:#e9f4f7; color:#26364a; font-family:"Hiragino Maru Gothic ProN",ui-rounded,system-ui,sans-serif; }
    h1 { margin:0 0 6px; font-size:20px; }
    p { margin:0 0 14px; font-size:13px; }
    .panels { display:flex; justify-content:center; align-items:start; flex-wrap:wrap; gap:18px; }
    .panel { width:min(100%,430px); }
    .panel h2 { margin:0 0 7px; font-size:16px; }
    iframe { display:block; width:100%; height:830px; border:1px solid #d9cdb9; border-radius:16px; background:#fffaf3; }
  </style>
</head>
<body>
  <h1>同じアプリの別画面に見えるか</h1>
  <p>左は現行の洗面所、右は Think &amp; Say の外観モックです。左がホームのままなら「Listen &amp; Do → 洗面所」を選んでください。</p>
  <div class="panels">
    <section class="panel"><h2>現行：洗面所</h2><iframe id="bathroom" src="index.html" title="現行の洗面所画面"></iframe></section>
    <section class="panel"><h2>外観案：Think &amp; Say</h2><iframe src="think-and-say-prototype.html" title="Think and Say の外観モック"></iframe></section>
  </div>
  <script>
    document.getElementById('bathroom').addEventListener('load',event=>{
      try { event.currentTarget.contentDocument.getElementById('open-bathroom')?.click(); }
      catch { /* file: ではブラウザによってフレーム間操作が制限される。左は手動で開ける。 */ }
    },{once:true});
  </script>
</body>
</html>
