<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ec">
  <title>Think &amp; Say — オウチエイゴ外観モック</title>
  <style>
    :root { --ink:#26364a; --peach:#ffe4c4; --orange:#f79256; --blue:#66b7d6; --green:#75bd8b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; background:#e9f4f7; color:var(--ink); font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif; }
    button,a { font:inherit; -webkit-tap-highlight-color:transparent; }
    .app { width:min(100%,430px); min-height:100svh; overflow:hidden; background:#fffaf3; }
    .app > header { position:relative; display:flex; align-items:center; justify-content:space-between; gap:9px; min-height:68px; padding:calc(12px + env(safe-area-inset-top)) 16px 10px; overflow:hidden; background:radial-gradient(circle at 9% 23%,#fff4 0 2px,transparent 3px),radial-gradient(circle at 88% 73%,#fff3 0 2px,transparent 3px),linear-gradient(135deg,#ff7379,#f98868); background-size:18px 18px,23px 23px,auto; border-bottom:5px solid #ffe6a8; box-shadow:0 4px 0 #c9565f; color:#fff; }
    .stage-back,.round { display:grid; place-items:center; flex:none; width:42px; height:42px; padding:0; border:3px solid #fff9e8; border-radius:17px 19px 17px 19px; background:linear-gradient(145deg,#fffdf0,#f6dba8); box-shadow:0 4px 0 #bc765c,inset 0 2px 0 #fff; color:#764b39; text-decoration:none; font-size:24px; font-weight:900; line-height:1; text-shadow:0 1px 0 #fff; }
    .stage-back:active,.round:active { transform:translateY(2px) rotate(-1deg); box-shadow:0 2px 0 #bc765c,inset 0 2px 0 #fff; }
    header h1 { flex:1; margin:0; color:#fff; text-align:center; text-shadow:0 2px 0 #c84451; font-size:20px; font-weight:900; }
    .round { background:linear-gradient(145deg,#fff5a3,#ffc95b); font-size:21px; }
    .scene { position:relative; width:100%; aspect-ratio:3/4; overflow:hidden; background:#fff7e2 url('living-stage-v2.png.webp') center / 100% 100% no-repeat; touch-action:none; user-select:none; }
    .scene::after { content:""; position:absolute; z-index:1; inset:auto 0 0; height:12%; border-top:4px solid #9c571f; border-bottom:4px solid #7c3f17; background:repeating-linear-gradient(7deg,#bd742d 0 3px,#c98238 4px 7px,#b86e28 8px 10px); box-shadow:inset 0 4px 0 #f6c375,inset 0 -7px 0 #7c3f17,0 -3px 8px #4a2b173b; }
    .bubble { position:absolute; z-index:3; left:9%; top:3%; width:82%; height:42%; padding:8px 13px 13px; border:5px solid #fff9e8; border-radius:46% 44% 43% 42% / 33% 34% 37% 38%; background:#fffdf4f2; box-shadow:0 5px 0 #b56b42,0 10px 18px #7b4a3430; }
    .bubble::after { content:""; position:absolute; left:47%; bottom:-20px; width:15px; height:15px; border:3px solid #fff9e8; border-radius:50%; background:#fffdf4; box-shadow:0 3px 0 #b56b42; }
    .bubble-picture { display:block; width:auto; max-width:52%; height:55%; margin:0 auto; object-fit:contain; filter:drop-shadow(0 3px 1px #5f45262e); }
    .slots { position:absolute; right:8%; bottom:10%; left:8%; display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .slot { display:grid; place-items:center; min-height:57px; padding:5px; border:3px dashed; border-radius:17px; background:#fffdf4e8; font-size:12px; font-weight:900; text-align:center; line-height:1.1; }
    .slot.blue { border-color:#4294c4; color:#326b96; }
    .slot.orange { border-color:#e88443; color:#ad5b2d; }
    .cat { position:absolute; z-index:4; left:3%; top:38%; width:11%; height:auto; object-fit:contain; filter:drop-shadow(0 3px 1px #5f45262e); pointer-events:none; }
    .boy { position:absolute; z-index:3; left:50%; bottom:11%; width:30%; height:42%; transform:translateX(-50%); object-fit:contain; object-position:bottom; filter:drop-shadow(0 4px 2px #5f45262e); pointer-events:none; }
    .cards { position:absolute; z-index:5; top:49%; width:30%; display:grid; gap:8px; }
    .cards.left { left:2%; }
    .cards.right { right:2%; }
    .card { min-height:65px; display:grid; place-items:center; padding:6px; border:3px solid #fffdf5; border-radius:19px; color:#fff; text-align:center; font-size:clamp(13px,3.8vw,17px); font-weight:900; line-height:1.12; text-shadow:0 2px 0 #0002; box-shadow:0 5px 0 #b56b42,0 9px 14px #41251655; }
    .card.blue { background:linear-gradient(135deg,#82c4df,#567fc3 75%); }
    .card.orange { background:linear-gradient(135deg,#ffaf45,#f47d42 75%); }
    .card:active { transform:translateY(3px); box-shadow:0 2px 0 #b56b42,0 5px 10px #41251655; }
    .foot { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:15px 16px calc(16px + env(safe-area-inset-bottom)); background:#fff9e8; }
    .legend { min-width:0; color:#754c35; font-size:12px; font-weight:900; line-height:1.3; }
    .hint { flex:none; min-height:43px; padding:0 16px; border:3px solid #fffdf5; border-radius:18px; background:linear-gradient(145deg,#fffdf4,#f6dfc1); box-shadow:0 4px 0 #8a4d26; color:#754c35; font-size:14px; font-weight:900; }
    .hint:active { transform:translateY(2px); box-shadow:0 2px 0 #8a4d26; }
    .hint-text { display:none; padding:0 16px 14px; background:#fff9e8; color:#754c35; font-size:13px; font-weight:800; }
    .hint-text.show { display:block; }
    @media(max-width:360px) { .card { min-height:58px; font-size:12px; } .cards { gap:6px; } .slot { min-height:48px; } }
  </style>
</head>
<body>
  <div class="app">
    <header><a class="stage-back" href="index.html" aria-label="ホームへ戻る">‹</a><h1>Think &amp; Say</h1><a class="round" href="index.html" aria-label="ホームへ戻る">⌂</a></header>
    <main>
      <div class="scene" aria-label="明るいリビングで、男の子がパパに本を読んでもらいたい場面">
        <div class="bubble" aria-label="絵の吹き出しとカードを置く2つの枠">
          <img class="bubble-picture" src="word-target-dad-v1.png.webp" alt="本を開いているパパの絵">
          <div class="slots"><div class="slot blue" aria-label="青いカードの枠"></div><div class="slot orange" aria-label="オレンジのカードの枠"></div></div>
        </div>
        <img class="cat" src="cat-mascot-v2-small.png.webp" alt="ねこのマスコット">
        <div class="cards left" aria-label="青いカード3枚"><div class="card blue">I want to</div><div class="card blue">Can I</div><div class="card blue">Can you</div></div>
        <img class="boy" src="word-target-boy-v1.png.webp" alt="全身が見える男の子">
        <div class="cards right" aria-label="オレンジのカード3枚"><div class="card orange">read<br>the book</div><div class="card orange">get<br>the book</div><div class="card orange">put<br>the book</div></div>
      </div>
      <div class="foot"><span class="legend">青いカードと オレンジのカードを<br>ふきだしに はこぼう</span><button class="hint" id="hint" type="button" aria-expanded="false" aria-controls="hint-text">ヒント</button></div>
      <div class="hint-text" id="hint-text">パパに、本を読んでもらいたい場面だよ。</div>
    </main>
  </div>
  <script>
    const hint=document.getElementById('hint');
    hint.addEventListener('click',()=>{
      const shown=document.getElementById('hint-text').classList.toggle('show');
      hint.setAttribute('aria-expanded',String(shown));
    });
  </script>
</body>
</html>
