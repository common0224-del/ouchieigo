<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech synthesis test</title>
  <style>
    body { max-width:820px; margin:0 auto; padding:24px; background:#f6f7fb; color:#1f2937; font:16px/1.45 system-ui,sans-serif; }
    h1 { margin-top:0; } .buttons { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
    button { min-height:52px; border:0; border-radius:12px; padding:10px; background:#2563eb; color:#fff; font:700 15px inherit; cursor:pointer; } button:disabled { background:#94a3b8; cursor:not-allowed; }
    #log { min-height:160px; overflow:auto; padding:12px; border-radius:12px; background:#111827; color:#e5e7eb; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
    table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; } th,td { padding:8px; border:1px solid #d1d5db; text-align:left; vertical-align:top; word-break:break-word; } th { background:#e5e7eb; }
  </style>
</head>
<body>
  <h1>Speech synthesis test</h1>
  <p id="environment"></p>
  <div class="buttons">
    <button id="default">1. Default voice: “hello”</button>
    <button id="local">2. Local English voice</button>
    <button id="remote">3. Remote English voice</button>
    <button id="sound">4. Sound effect</button>
  </div>
  <h2>Event log</h2><pre id="log"></pre>
  <h2>Available voices</h2>
  <table><thead><tr><th>Name</th><th>Language</th><th>Local</th><th>Default</th></tr></thead><tbody id="voices"></tbody></table>
  <script>
    const synth=window.speechSynthesis, logBox=document.querySelector('#log'), voicesBody=document.querySelector('#voices');
    const log=(label,data)=>{ const line=`${new Date().toLocaleTimeString()} ${label}${data ? ` ${JSON.stringify(data)}` : ''}`; console.log('[speech-test]',line); logBox.textContent+=`${line}\n`; logBox.scrollTop=logBox.scrollHeight; };
    const allVoices=()=>synth ? synth.getVoices() || [] : [];
    const englishVoices=()=>allVoices().filter(v=>(v.lang||'').toLowerCase().startsWith('en'));
    function renderVoices() { const voices=allVoices(); voicesBody.replaceChildren(...voices.map(v=>{ const row=document.createElement('tr'); [v.name,v.lang,String(v.localService),String(v.default)].forEach(value=>{ const cell=document.createElement('td'); cell.textContent=value; row.append(cell); }); return row; })); log('voices',{total:voices.length,english:englishVoices().length}); }
    document.querySelector('#environment').textContent=`speechSynthesis: ${Boolean(synth)} / iframe: ${window.self!==window.top} / ${navigator.userAgent}`;
    function speak(kind) { if(!synth) return log('unsupported'); const voices=englishVoices(), local=voices.find(v=>v.localService), remote=voices.find(v=>!v.localService); if(kind==='local' && !local) return log('no local English voice'); if(kind==='remote' && !remote) return log('no remote English voice'); const u=new SpeechSynthesisUtterance('hello'); u.lang='en-US'; if(kind==='local') u.voice=local; if(kind==='remote') u.voice=remote; u.onstart=()=>log('onstart',{kind,voice:u.voice?.name||'(default)'}); u.onend=()=>log('onend',{kind}); u.onerror=e=>log('onerror',{kind,error:e.error}); log('before speak',{kind,voice:u.voice?.name||'(default)',speaking:synth.speaking,pending:synth.pending,paused:synth.paused}); synth.speak(u); log('after speak',{kind,speaking:synth.speaking,pending:synth.pending,paused:synth.paused}); setTimeout(()=>log('after 300ms',{kind,speaking:synth.speaking,pending:synth.pending,paused:synth.paused}),300); }
    document.querySelector('#default').addEventListener('click',()=>speak('default'));
    document.querySelector('#local').addEventListener('click',()=>speak('local'));
    document.querySelector('#remote').addEventListener('click',()=>speak('remote'));
    document.querySelector('#sound').addEventListener('click',()=>{ const AudioContext=window.AudioContext||window.webkitAudioContext; if(!AudioContext) return log('Web Audio unsupported'); const context=new AudioContext(), oscillator=context.createOscillator(), gain=context.createGain(); oscillator.frequency.value=660; gain.gain.setValueAtTime(.1,context.currentTime); gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.2); oscillator.connect(gain).connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime+.22); log('sound effect',{state:context.state}); });
    if(synth) synth.addEventListener('voiceschanged',renderVoices);
    renderVoices();
  </script>
</body>
</html>
